# Автодеплой: після кожного пушу в main хостинг сам підтягує зміни
# (те саме, що кнопка cPanel → Git Version Control → Update from Remote).
# Потрібен секрет репозиторію CPANEL_TOKEN — API-токен cPanel користувача cciqgqvp.
name: Deploy to Hostpro

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Update from Remote (cPanel UAPI)
        env:
          CPANEL_TOKEN: ${{ secrets.CPANEL_TOKEN }}
        run: |
          if [ -z "$CPANEL_TOKEN" ]; then
            echo "::warning::Секрет CPANEL_TOKEN не задано — деплой пропущено. Натисніть Update from Remote у cPanel вручну."
            exit 0
          fi
          resp=$(curl -sS --fail-with-body --max-time 120 \
            -H "Authorization: cpanel cciqgqvp:${CPANEL_TOKEN}" \
            --data-urlencode "repository_root=/home/cciqgqvp/public_html" \
            --data-urlencode "branch=main" \
            "https://skm261.hostsila.org:2083/execute/VersionControl/update")
          echo "$resp" | head -c 600; echo
          echo "$resp" | grep -q '"status":1' || { echo "::error::cPanel не підтвердив оновлення"; exit 1; }
